aid: aghanim
name: Aghanim
description: >-
  Aghanim is a direct-to-consumer (DTC) enablement platform for mobile games,
  founded in 2023 by former Xsolla executives. It lets studios launch web-based
  game hubs and web shops that sell virtual goods, currency packs, battle passes,
  and subscriptions outside the app stores, and acts as a Merchant of Record —
  handling worldwide payments, tax compliance, fraud, and chargebacks across 200+
  territories. Its Server-to-Server API (170 operations) and webhook surface cover
  catalog/stores, items, orders, players, coupons, promotions, achievements,
  leaderboards, daily rewards, LiveOps campaigns, segmentation, creators, news,
  pages, and loyalty programs, with Unity and Android checkout SDKs for the
  prebuilt checkout page. Added to the API Evangelist network from the a16z
  portfolio and enriched from Aghanim's public developer surface.
url: https://raw.githubusercontent.com/api-evangelist/aghanim/refs/heads/main/apis.yml
