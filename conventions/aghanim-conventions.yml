  surface: webhook-delivery
  field: idempotency_key
  description: >-
    Webhook event payloads include `idempotency_key` and `request_id`; consumers
    dedupe on `idempotency_key` to make webhook handlers safe under redelivery.
  api_request_idempotency: false
