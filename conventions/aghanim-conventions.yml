notes: >-
  Cross-cutting request/response semantics for the Aghanim Server-to-Server API,
  derived from the OpenAPI and the docs. Idempotency here is a webhook-delivery
  contract: Aghanim event payloads carry an `idempotency_key` (and `request_id`)
  so consumers can safely dedupe redelivered events. The REST API itself does not
  document a request-level Idempotency-Key header.
